<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#12171A" media="(prefers-color-scheme: dark)">

<title>Cabos Apto — Quantitativo elétrico</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E9ECEE; --surface:#F7F8F9; --ink:#1B2226; --muted:#5A676F; --line:#CBD2D6; --field:#FFFFFF;
  --accent:#1F4E9E; --accent-ink:#FFFFFF; --accent-soft:#DDE7F6; --warn:#9A3B14; --scrim:rgba(10,14,16,.5);
  --c-verm:#C8372D; --c-verde:#2F8A55; --c-preto:#23282B; --c-amar:#D9A400;
  --k-vermelho:#C8372D; --k-verde:#2F8A55; --k-preto:#23282B; --k-amarelo:#D9A400; --k-branco:#FFFFFF; --k-azul:#2A6FDB; --k-marrom:#7A4A2B; --k-cinza:#8A949A; --k-laranja:#E8751A; --k-roxo:#7B4BB5; --k-rosa:#E26FA7; --k-bege:#D8C3A0;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171A; --surface:#1B2226; --ink:#E6EBEE; --muted:#A0AEB6; --line:#2E393F; --field:#232C31;
    --accent:#86AEF0; --accent-ink:#0D1A2E; --accent-soft:#223149; --warn:#F0A07A;
    --c-verm:#EE6A5F; --c-verde:#5CC688; --c-preto:#C9D0D4; --c-amar:#F0C030; color-scheme:dark;
    --k-vermelho:#EE6A5F; --k-verde:#5CC688; --k-preto:#C9D0D4; --k-amarelo:#F0C030; --k-branco:#FFFFFF; --k-azul:#6FA3F5; --k-marrom:#B07A55; --k-cinza:#A8B2B8; --k-laranja:#F29A52; --k-roxo:#A98BE0; --k-rosa:#F29BC4; --k-bege:#E6D5B8;
  }
}
:root[data-theme="dark"]{
  --bg:#12171A; --surface:#1B2226; --ink:#E6EBEE; --muted:#A0AEB6; --line:#2E393F; --field:#232C31;
  --accent:#86AEF0; --accent-ink:#0D1A2E; --accent-soft:#223149; --warn:#F0A07A;
  --c-verm:#EE6A5F; --c-verde:#5CC688; --c-preto:#C9D0D4; --c-amar:#F0C030; color-scheme:dark;
    --k-vermelho:#EE6A5F; --k-verde:#5CC688; --k-preto:#C9D0D4; --k-amarelo:#F0C030; --k-branco:#FFFFFF; --k-azul:#6FA3F5; --k-marrom:#B07A55; --k-cinza:#A8B2B8; --k-laranja:#F29A52; --k-roxo:#A98BE0; --k-rosa:#F29BC4; --k-bege:#E6D5B8;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.tab,.tp,.btn,.del,.ghost,.ob{transition:background-color .15s ease,color .15s ease,border-color .15s ease,box-shadow .15s ease}
@media (prefers-reduced-motion: reduce){
  *{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.h1row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font:600 11px/1 var(--font-head);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:2px}
.obra{display:flex;align-items:center;gap:8px;background:none;border:0;padding:2px 0;min-width:0;max-width:100%;cursor:pointer;text-align:left;font:600 22px/1.15 var(--font-head);color:var(--ink)}
.obra .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obra .car{color:var(--accent);font-size:16px;flex:none}
.chip{font:500 12px/1 var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 10px;white-space:nowrap;background:var(--surface);flex:none}
.chip[data-s="saved"]{color:var(--c-verde)}
.chip[data-s="pending"]{color:var(--accent)}
.chip[data-s="local"]{color:var(--warn)}

main{display:grid;gap:14px;padding-block:14px 96px;min-width:0}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.sheet h2{margin:0 0 8px;font:600 13px/1.2 var(--font-head);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.grp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.grp-h h2{margin:0}
.grp-h{gap:8px;margin-bottom:6px}
.gname{height:40px;flex:1;font:600 14px/1 var(--font-head);text-transform:uppercase;letter-spacing:.06em}
.grp-h .del{flex:none;height:40px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-right,0px))}
.tab{min-height:52px;background:none;border:0;border-top:3px solid transparent;color:var(--muted);font:600 13px/1 var(--font-head);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tab[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}

.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--field)}
.seg button{min-height:42px;border:0;background:none;font:600 13px/1 var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tp{flex:none;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--field);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.tp[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tp.add{border-style:dashed;color:var(--accent);background:none}

.fld{display:flex;align-items:center;gap:8px}
.fld label{font-size:13px;color:var(--muted)}
input[type=text],select{height:44px;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:16px;min-width:0;width:100%}
select{padding-right:4px}
input.num{font-family:var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.unit{position:relative;display:block}
.unit input{padding-right:26px}
.unit::after{content:attr(data-u);position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted);font:12px var(--font-mono);pointer-events:none}
.fld .unit{width:92px}
.fld .unit.sm{width:78px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:grid;gap:10px}

.row{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.l1{display:grid;grid-template-columns:minmax(0,1fr) 84px 40px;gap:6px;align-items:center}
.l1.t{grid-template-columns:62px minmax(0,1fr) 84px 40px}
.l2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.l2e{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:6px;align-items:center}
.l3{display:flex;align-items:center;justify-content:space-between;gap:8px}
.l3 .ob2{flex:1;min-width:0}
.name{font-weight:500}
.obs{font-size:14px;color:var(--muted);height:36px}
.ghost{background:none;border:0;color:var(--accent);font-size:13px;padding:6px 4px;min-height:36px;cursor:pointer;text-align:left}
.del{height:44px;width:40px;border:1px solid var(--line);background:var(--field);border-radius:6px;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
.del[data-c="1"]{width:auto;padding:0 8px;font-size:12px;color:#fff;background:var(--warn);border-color:var(--warn)}
.add{min-height:44px;border:1px dashed var(--line);background:none;border-radius:8px;color:var(--accent);font-weight:500;width:100%;cursor:pointer;margin-top:6px}

.mt{display:flex;flex-wrap:wrap;gap:2px 12px;font:500 12px/1.5 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink);justify-content:flex-end}
.mt span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.mt1{font:500 12px/1.5 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;border:1px solid var(--line)}
.s0{background:var(--c-verm)}.s1{background:var(--c-verde)}.s2{background:var(--c-preto)}.s3{background:var(--c-amar)}

.q{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.q label{display:grid;gap:3px;font:500 11px/1 var(--font-mono);color:var(--muted)}
.q label span{display:flex;align-items:center;gap:4px}
.q input{text-align:center;padding:0 2px}

.tbl{overflow-x:auto}
.g{display:grid;grid-template-columns:minmax(84px,1.35fr) repeat(4,minmax(0,1fr));min-width:330px}
.g>div{padding:7px 4px;border-top:1px solid var(--line);font:500 12px/1.3 var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.g>div.lb{font:500 13px/1.3 var(--font-body);text-align:left;padding-left:0}
.g>div.hd{border-top:0;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:flex-end;gap:4px}
.g>div.hd.lb{justify-content:flex-start}
.g>div.b{font-weight:600}
.g>div.hl{background:var(--accent-soft)}
.g>div.sp{border-top:2px solid var(--line)}
.note{color:var(--muted);font-size:13px;margin:0}
.note.empty{padding:20px;text-align:center;border:1px dashed var(--line);border-radius:8px;background:var(--field)}
.warnbox{border:1px solid var(--warn);border-radius:8px;padding:10px 12px;display:grid;gap:6px;font-size:13px;background:color-mix(in srgb,var(--warn) 6%,var(--surface))}
.btn{min-height:46px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 16px;cursor:pointer;width:100%}
.btn.alt{background:none;color:var(--accent)}
.btn.warn{background:none;border-color:var(--warn);color:var(--warn)}
.btn.warn[data-c="1"]{background:var(--warn);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pt{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(4,minmax(0,1fr));gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.pt.h{border-top:0;font:500 11px/1.2 var(--font-mono);color:var(--muted)}
.pt.h span{display:flex;align-items:center;gap:4px;justify-content:center}
.pt.h span:first-child{justify-content:flex-start}
.pt .nm{font-size:14px}
.pt input{text-align:center;padding:0 2px;font-family:var(--font-mono)}

.ov{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end}
.panel{background:var(--surface);width:100%;max-height:90%;overflow-y:auto;border-radius:14px 14px 0 0;border-top:1px solid var(--line);display:grid;gap:16px;align-content:start;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel h2{margin:0;font:600 18px/1.2 var(--font-head)}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ob{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);width:100%;font-weight:500;cursor:pointer;text-align:left}
.ob[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.psec{display:grid;gap:8px}
.psec>h3{margin:0;font:600 12px/1.2 var(--font-head);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.mcard{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:4px;min-width:0;align-content:start}
.mcard .mh{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;font:600 12px/1.2 var(--font-head);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mcard .mv{font:600 19px/1.1 var(--font-mono);font-variant-numeric:tabular-nums}
.mcard .ms{font:500 12px/1.4 var(--font-mono);color:var(--muted)}
.mcard .mr{font:600 12px/1.4 var(--font-mono);color:var(--accent)}
.tag{display:inline-block;font:600 10px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--warn);color:var(--warn);border-radius:4px;padding:2px 4px}
.cab select{padding:0 2px 0 6px;font-size:15px}
.cab{display:grid;grid-template-columns:12px minmax(0,1fr) 92px auto;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.l2a{display:flex;align-items:center;gap:8px}
.l2a label{font-size:12px;color:var(--muted);flex:none}
.gname.bad,.bad{border-color:var(--warn)}
.amb{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.amb .cnt{font:500 12px/1 var(--font-mono);color:var(--muted);white-space:nowrap}
textarea{width:100%;min-height:84px;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:12px/1.4 var(--font-mono);color:var(--ink)}
input[type=file]{width:100%;font-size:14px}
.pair2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pair2 .btn{min-height:42px;padding:0 8px;font-size:14px}
.ob small{font:500 12px/1 var(--font-mono);color:var(--muted)}
.ob[aria-current="true"] small{color:inherit}
</style>
</head>
<body>

<header class="top">
  <div class="h1row">
    <div style="min-width:0">
      <div class="eyebrow">Obra</div>
      <button class="obra" id="obraBtn" type="button" aria-haspopup="dialog" aria-label="Trocar de obra"><span class="nm" id="obraNome">Jerivás</span><span class="car" aria-hidden="true">▾</span></button>

</header>
<main id="view"></main>
<nav class="tabs" id="tabs" aria-label="Telas"></nav>
<div class="ov" id="ov" hidden></div>

  else K.table(['Trecho','Compr. (m)','Diâmetro','Qtd.','Total (m)','Observação'],
    list.map(function(r){return [r.n,pf(n(r.d)),DMN[r.dm|0],pf0(n(r.q)),pf(n(r.d)*n(r.q)),r.o]}).concat([['Total (m)','','','',pf(te),'']]),K.right(1,4))}

function exportPdf(msg){
  if(!dl){msg.textContent='Download indisponível neste navegador.';return}
  msg.textContent='Gerando PDF…';
  loadPdf().then(function(JsPDF){
    var o=O(),K=pdfKit(JsPDF,o.nome),today=new Date().toLocaleDateString('pt-BR');
    K.heading('Quantitativo de cabos e eletrodutos',16,K.DARK);
    K.para('Obra: '+o.nome+'   |   Gerado em '+today+'   |   Medidas em metros');
    var HC=pdfCabH(o),N=nc(o);
    [['c','Resumo - Cabos',HC],['e','Resumo - Eletrodutos',DMN]].forEach(function(S){
      var k=S[0],NN=nk(o,k);K.y+=2;K.heading(S[1],12,K.BLUE);
      if(k==='e'&&o.eletroNota)K.para(o.eletroNota);
      if(k==='e'&&o.eletroEst)K.para('Atenção: trechos e diâmetros de eletroduto são ESTIMATIVAS, não um dimensionamento validado.');
      K.table([k==='c'?'Total geral':'Total geral por diâmetro'].concat(S[2]),[
        ['Sem perdas'].concat(totalObra(o,k,'sq').map(pf)),
        ['Com perdas'].concat(totalObra(o,k,'sp').map(pf)),
        [(k==='c'?'Rolos de ':'Unidades de ')+pf0(n(k==='c'?o.rolo:o.roloE))+' m'].concat(rolosOf(o,k,totalObra(o,k,'sp')).map(pf0))],K.right(1,NN));
      o.tipos.forEach(function(t){var a=calc(o,t)[k],q=pf0(n(t.qtd));
        K.heading(t.nome+' - '+q+' aptos - perdas '+n(k==='c'?t.perdas:t.perdasE)+'%',10,K.DARK);
        K.table(['Metros'].concat(S[2]),[
          ['Parede, 1 apto'].concat(a.p.map(pf)),['Teto, 1 apto'].concat(a.t.map(pf)),['Soma, 1 apto'].concat(a.s.map(pf)),
          ['Parede x '+q].concat(a.pq.map(pf)),['Teto x '+q].concat(a.tq.map(pf)),['Soma x '+q].concat(a.sq.map(pf)),
          ['Com perdas'].concat(a.sp.map(pf))],K.right(1,NN))})});
    K.y+=2;K.heading('Premissas - condutores por tipo de ponto (cabos)',12,K.BLUE);
    K.table(['Tipo de ponto'].concat(HC),TIPOS.map(function(tp){return [tp].concat(o.prem[tp].map(function(v){return pf0(n(v))}))}),K.right(1,N));
    K.para('Rolo de cabo: '+pf0(n(o.rolo))+' m. Rolo ou barra de eletroduto: '+pf0(n(o.roloE))+' m.');
    o.tipos.forEach(function(t){
      K.doc.addPage();K.y=K.M;
      K.heading('Anotações - '+t.nome+' ('+pf0(n(t.qtd))+' aptos)',13,K.BLUE);
      if(t.parede.length){K.heading('Cabos - parede',10,K.DARK);pdfPontosParede(K,o,t)}
      if(t.teto.length){K.heading('Cabos - teto',10,K.DARK);pdfTeto(K,o,t)}
      if(t.ant.length){K.heading('Comunicação (fita de arquear)',10,K.DARK);
        K.table(['Ponto','Distância (m)'],t.ant.map(function(r){return [r.n,pf(n(r.d))]}),K.right(1,1))}
      if(t.ep.length){K.heading('Eletrodutos - parede',10,K.DARK);pdfEletroTab(K,t.ep,'parede')}
      if(t.et.length){K.heading('Eletrodutos - teto',10,K.DARK);pdfEletroTab(K,t.et,'teto')}
    });
    return K.finish('Quantitativo_'+fileBase(o)+'.pdf')
  }).then(function(){msg.textContent='PDF enviado.'},function(e){msg.textContent=errMsg(e,'o PDF')})}

function exportPdfApto(tid,msg){
  if(!dl){msg.textContent='Download indisponível neste navegador.';return}
  msg.textContent='Gerando PDF…';
  loadPdf().then(function(JsPDF){
    var o=O(),t=o.tipos.filter(function(x){return x.id===tid})[0];if(!t)throw new Error('tipo');
    var K=pdfKit(JsPDF,o.nome+' - '+t.nome),today=new Date().toLocaleDateString('pt-BR');
    var C=calc(o,t),HC=pdfCabH(o),N=nc(o);
    var pc=n(t.perdas),pe=n(t.perdasE),fc=1+pc/100,fe=1+pe/100,q=n(t.qtd);
    K.heading('Relatório de quantitativo - 1 apartamento',16,K.DARK);
    K.para('Obra: '+o.nome+'   |   Tipo: '+t.nome+'   |   Gerado em '+today+'   |   Medidas em metros');
    K.para('Os valores abaixo se referem a UMA unidade deste tipo (a obra tem '+pf0(q)+' unidade(s) cadastrada(s)). Nenhum valor foi multiplicado pela quantidade de apartamentos.');
    K.y+=1;K.heading('1. Resumo executivo de materiais',12,K.BLUE);
    var rc=n(o.rolo),re=n(o.roloE);
    var ceil=function(v,r){return r>0?Math.ceil(v/r-1e-9):0};
    K.table(['Cabo','Parede (m)','Teto (m)','Sem perdas (m)','Perdas','Com perdas (m)','Rolos de '+pf0(rc)+' m'],
      o.cabos.map(function(c,i){var cp=C.c.s[i]*fc;return [cname(c),pf(C.c.p[i]),pf(C.c.t[i]),pf(C.c.s[i]),pc+'%',pf(cp),pf0(ceil(cp,rc))]}),K.right(1,6));
    K.table(['Eletroduto (estimado)','Parede (m)','Teto (m)','Sem perdas (m)','Perdas','Com perdas (m)','Unidades de '+pf0(re)+' m'],
      DMN.map(function(d,i){var cp=C.e.s[i]*fe;return [d,pf(C.e.p[i]),pf(C.e.t[i]),pf(C.e.s[i]),pe+'%',pf(cp),pf0(ceil(cp,re))]}),K.right(1,6));
    K.para('Rolos e unidades calculados para esta unidade isolada: metragem com perdas ÷ comprimento comercial, arredondado para cima. A compra da obra deve usar o total geral (Resumo - Obra completa).');
    K.y+=1;K.heading('2. Quantidades de condutores por tipo de ponto',12,K.BLUE);
    var usados={};t.parede.forEach(function(r){usados[r.t]=1});
    K.table(['Tipo de ponto'].concat(HC),TIPOS.filter(function(x){return usados[x]}).map(function(tp){return [tp].concat(o.prem[tp].map(function(v){return pf0(n(v))}))}),K.right(1,N));
    K.para('Memória de cálculo: metragem de cada cabo em um ponto ou trecho = distância × quantidade de condutores daquele cabo. Total sem perdas = parede + teto. Total com perdas = sem perdas × (1 + perdas/100).');
    K.heading('3. Cabos - parede (memória de cálculo dos pontos)',12,K.BLUE);
    if(t.parede.length)pdfPontosParede(K,o,t);else K.para('Sem pontos de parede cadastrados.');
    K.heading('4. Cabos - teto (memória de cálculo dos trechos)',12,K.BLUE);
    if(t.teto.length)pdfTeto(K,o,t);else K.para('Sem trechos de teto cadastrados.');
    if(t.ant.length){K.heading('Comunicação (fita de arquear) - fora dos cabos',10,K.DARK);
      K.table(['Ponto','Distância (m)'],t.ant.map(function(r){return [r.n,pf(n(r.d))]}),K.right(1,1))}
    K.heading('5. Totais de cabos desta unidade',12,K.BLUE);
    K.table(['Total'].concat(HC),[
      ['Parede'].concat(C.c.p.map(pf)),['Teto'].concat(C.c.t.map(pf)),['Total sem perdas'].concat(C.c.s.map(pf)),
      ['Perdas ('+pc+'%)'].concat(C.c.s.map(function(v){return pf(v*pc/100)})),
      ['Com perdas'].concat(C.c.s.map(function(v){return pf(v*fc)})),
      ['Rolos de '+pf0(rc)+' m'].concat(C.c.s.map(function(v){return pf0(ceil(v*fc,rc))}))],K.right(1,N));
    K.heading('6. Eletrodutos por diâmetro (ESTIMADOS)',12,K.BLUE);
    if(o.eletroEst)K.para('Os trechos e diâmetros de eletroduto foram estimados a partir das distâncias dos cabos e não são um dimensionamento tecnicamente validado. Confira antes de comprar.');
    K.table(['Total'].concat(DMN),[
      ['Parede'].concat(C.e.p.map(pf)),['Teto'].concat(C.e.t.map(pf)),['Total sem perdas'].concat(C.e.s.map(pf)),
      ['Perdas ('+pe+'%)'].concat(C.e.s.map(function(v){return pf(v*pe/100)})),
      ['Com perdas'].concat(C.e.s.map(function(v){return pf(v*fe)})),
      ['Unidades de '+pf0(re)+' m'].concat(C.e.s.map(function(v){return pf0(ceil(v*fe,re))}))],K.right(1,4));
    if(t.ep.length){K.heading('Eletrodutos - parede',10,K.DARK);pdfEletroTab(K,t.ep,'parede')}
    if(t.et.length){K.heading('Eletrodutos - teto',10,K.DARK);pdfEletroTab(K,t.et,'teto')}
    K.heading('7. Observações técnicas',12,K.BLUE);
    var obs=['Cabos: '+HC.join('; ')+'.',
      'Valores calculados sem arredondamento intermediário; apenas a quantidade de rolos e unidades é arredondada para cima.',
      'Comunicação (fita de arquear) fica fora dos cabos: só tem distância, sem especificação de cabo.'];
    if(o.eletroEst)obs.push('Eletrodutos: quantidades e diâmetros estimados (ver item 6).');
    t.parede.concat(t.ep,t.et).forEach(function(r){if(r.o)obs.push((r.p||r.n||r.a)+': '+r.o)});
    obs.forEach(function(x){K.para('- '+x)});
    return K.finish('Quantitativo_'+fileBase(o)+'_'+fileBase({nome:t.nome})+'.pdf')
  }).then(function(){msg.textContent='PDF enviado.'},function(e){msg.textContent=errMsg(e,'o PDF')})}

/* ---------- sincronização e inicialização ---------- */
function syncRemote(snap){
  if(snap.metadata.hasPendingWrites)return;
  var changed=false;
  snap.docChanges().forEach(function(ch){
    var id=ch.doc.id,d=ch.doc.data();
    if(ch.type==='removed'){
      if(dirtyIds.has(id))return;
      var j=OBRAS.findIndex(function(x){return x.id===id});
      if(j>=0&&OBRAS.length>1){OBRAS.splice(j,1);changed=true}
      return}
    if(!d||!Array.isArray(d.tipos)||dirtyIds.has(id)||saving)return;
    var i=OBRAS.findIndex(function(x){return x.id===id});
    if(i<0){OBRAS.push(fixObra(clone(d)));changed=true}
    else if((d.upd||0)>(OBRAS[i].upd||0)){OBRAS[i]=fixObra(clone(d));changed=true}});
  if(changed){
    if(!OBRAS.some(function(x){return x.id===ativa}))ativa=OBRAS[0].id;
    persistLocal();
    if(busy()||!document.getElementById('ov').hidden)pendingRender=true;else render()}
  setStatus('saved')}
function boot(){
  if(!dl)dl=fallbackDl();
  var c=window.claude;if(!c||!c.use)return;
  c.use('downloads').then(function(d){
    if(d)dl=d;
    if((tab==='ajustes'||tab==='resumo'||tab==='dados')&&!busy())render()
  },function(){});
  c.use('db').then(function(db){
    if(!db)return;ref=db.collection('obras');
    setStatus('saved');
    ref.onSnapshot(syncRemote,function(){setStatus('local')})
  },function(){setStatus('local')})}

dl=fallbackDl();
persistLocal();
document.getElementById('obraBtn').addEventListener('click',openObras);
document.getElementById('ov').addEventListener('click',function(e){if(e.target===this)closeObras()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!document.getElementById('ov').hidden)closeObras()});
document.addEventListener('focusout',function(){setTimeout(function(){
  if(pendingRender&&!busy()&&document.getElementById('ov').hidden){pendingRender=false;render()}},50)});
render();
setStatus('local');
boot();
})();
